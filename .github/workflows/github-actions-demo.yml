name: GitHub Actions Demo

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: environment
        required: true
    
  push:
    branches: [main]
    paths-ignore: .github/**

  pull_request:
    branches: [main]

 # schedule:
 #   - cron: '1 10 * * *'
 #   - cron: '15 6 * * 0'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Event Name
        run: 'echo Event: ${{ github.event_name }}'

  Test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: Build
    environment: Test
    steps:
      - run: echo "Testing..."

  Load-Test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: Build
    environment: Load-Test
    steps:
      - run: |
          echo "Testing..."
          sleep 15

  Production:
    runs-on: ubuntu-latest
    needs: [Test, Load-Test]
    environment:
      name: Production
      url: https://writeabout.net
    if: github.event.inputs.environment == 'Production'
    steps:
      - run: | 
          echo "Step 1 deploying..."
          sleep 5
      - run: | 
          echo "Step 2 deploying..."
          sleep 5
      - run: | 
          echo "Step 3 deploying..."
          sleep 5
      - run: | 
          echo "Step 4 deploying..."
          sleep 5
      - run: | 
          echo "Step 5 deploying..."
          sleep 5
        
      
      
