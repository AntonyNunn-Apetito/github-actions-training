name: GitHub Actions Demo

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: environment
        required: true
    
  push:
    branches: [main]
    paths-ignore: .github/**

  pull_request:
    branches: [main]

  schedule:
    - cron: '1 10 * * *'
    - cron: '15 6 * * 0'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Event Name
        run: 'echo Event: ${{ github.event_name }}'
      
