name: GitHub Actions Demo

on: 
  workflow_dispatch:
    
  push:
    branches: [main]
    paths-ignore: .github/**

  pull_request:
    branches: [main]

  schedule:
    - cron: '1 10 * * *'
    - cron: '15 6 * * 0'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo Event: {{ github.event_name }}'
